<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data: https://*.googleusercontent.com; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/collect-ag-mark.svg" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Description -->
    <meta name="description" content="COLLECT-AG — fee and member management for tutors, coaching centres, and small businesses. Your data stays in your Google Drive." />
    <meta name="keywords" content="fee management, tuition fees, coaching centre, student fees, receipt, invoice, free" />

    <!-- Theme -->
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3F0EE" media="(prefers-color-scheme: light)" />

    <!-- PWA / mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="COLLECT-AG" />
    <meta name="application-name" content="COLLECT-AG" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / social -->
    <meta property="og:title" content="COLLECT-AG — Fee and member management" />
    <meta property="og:description" content="Collect fees. Know your students. Own your data. Free, open-source, data in your Google Drive." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="COLLECT-AG" />
    <meta name="twitter:description" content="Fee and member management for tutors. Your data stays in your Google Drive." />

    <!-- Google Identity Services — async, non-blocking -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Restore GitHub Pages SPA routes before React mounts. -->
    <script src="%BASE_URL%spa-redirect.js"></script>

    <title>COLLECT-AG</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
